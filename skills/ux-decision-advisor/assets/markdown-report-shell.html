<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; base-uri 'none'; form-action 'none'">
<title>__TITLE__ · UXDA</title>
<style>
:root{--bg:#eef3f4;--paper:#fff;--ink:#17313b;--muted:#5d737c;--line:#d7e2e5;--navy:#153b46;--teal:#0f766e;--soft:#e7f4f1;--code:#f4f7f7;--warn:#fff4dd;--warnink:#765017}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.72 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:980px;margin:auto;padding:0 24px}header{background:var(--navy);color:#fff;padding:38px 0 32px;border-bottom:4px solid #75b9ae}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#a8d8d0;font-weight:750}h1{font-size:clamp(25px,4vw,38px);line-height:1.25;margin:9px 0 10px}header p{margin:0;color:#d7e7e9}.toolbar{position:sticky;top:0;z-index:3;background:rgba(238,243,244,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(9px)}.tools{display:flex;justify-content:space-between;gap:10px;align-items:center;padding-top:9px;padding-bottom:9px;flex-wrap:wrap}.note{font-size:12px;color:var(--muted)}button{border:1px solid #cbdadd;background:#fff;color:#28505b;border-radius:8px;padding:7px 11px;font:inherit;font-size:13px;cursor:pointer}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #4aa99e;outline-offset:3px}main{padding:26px 0 60px}.document{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:30px 34px}.document h1{font-size:29px;margin-top:0}.document h2{font-size:22px;margin:30px 0 12px;padding-top:8px;border-top:1px solid #e3ebed}.document h3{font-size:18px;margin:24px 0 10px}.document h4,.document h5,.document h6{font-size:16px;margin:20px 0 8px}.document p{margin:10px 0}.document ul,.document ol{margin:10px 0;padding-left:24px}.document li{margin:5px 0}.document a{color:var(--teal)}.document strong{font-weight:720}.document hr{border:0;border-top:1px solid var(--line);margin:24px 0}blockquote{margin:14px 0;padding:12px 16px;border-left:4px solid var(--teal);background:var(--soft);border-radius:8px;color:#285b55}code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:var(--code);border-radius:5px;padding:2px 5px;overflow-wrap:anywhere}pre{background:var(--code);border:1px solid #dfe8ea;border-radius:9px;padding:14px;overflow:auto;line-height:1.6}pre code{background:transparent;padding:0}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;margin:14px 0}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;vertical-align:top;padding:10px 11px;border-bottom:1px solid var(--line)}th{background:#edf4f4;color:#36545d;font-size:12px}tr:last-child td{border-bottom:0}.diagram{margin:16px 0;padding:15px;border:1px solid var(--line);border-radius:10px;background:#fbfdfd;overflow:auto}.diagram figcaption{font-size:12px;color:var(--muted);margin-top:8px}.mermaid-svg{display:block;width:100%;min-width:520px;height:auto}.mermaid-node{fill:#fff;stroke:#6b9f98;stroke-width:1.5}.mermaid-label{fill:#17313b;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.mermaid-edge{fill:none;stroke:#64858c;stroke-width:1.5}.mermaid-arrow{fill:#64858c}.mermaid-edge-label{fill:#5d737c;font:11px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.external-image{display:inline-block;padding:3px 7px;border:1px dashed #b8c8cc;border-radius:6px;color:var(--muted);font-size:12px}.small{font-size:12px;color:var(--muted)}details.source{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px 16px}details.source summary{cursor:pointer;font-weight:700;color:#285b62}details.source pre{max-height:480px}.footer{margin-top:18px;color:var(--muted);font-size:12px}
@media(max-width:640px){.wrap{padding:0 14px}header{padding:28px 0}.document{padding:20px 17px}.document h1{font-size:24px}.document h2{font-size:20px}.mermaid-svg{min-width:680px}}
@media print{body{background:#fff}.toolbar{display:none}.wrap{max-width:none;padding:0 8px}header{background:#fff;color:var(--ink);padding:8px 0;border-bottom:2px solid #9ccbc3}header p,.eyebrow{color:#45616a}.document{border:0;padding:0}.document h2{break-after:avoid}.diagram,.table-wrap,blockquote{break-inside:avoid}details.source{display:none}}
</style>
</head>
<body>
<header><div class="wrap"><div class="eyebrow">UXDA · Markdown H5</div><h1>__TITLE__</h1><p>__SUBTITLE__</p></div></header>
<div class="toolbar"><div class="wrap tools"><span class="note">__NOTE__</span><button id="print" type="button">__PRINT_LABEL__</button></div></div>
<main class="wrap"><article class="document">__CONTENT__</article><details class="source"><summary>__SOURCE_LABEL__</summary><pre><code>__SOURCE__</code></pre></details><div class="footer">__FOOTER__</div></main>
<script>
document.getElementById('print').addEventListener('click', () => window.print());
</script>
</body>
</html>
